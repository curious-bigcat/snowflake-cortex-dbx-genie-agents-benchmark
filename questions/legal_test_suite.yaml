         - EXCEPTION: 801(d)(2)(E) — co-conspirator statement during conspiracy
         - BUT: Chen's statement AGAINST the conspiracy (expressing doubt) may not qualify
         - Likely admissible as: present sense impression (803(1)) or state of mind (803(3))

      4. HARTWELL'S EMAIL TO PACIFIC GROWTH:
         - "Don't wait on APEX. Next 2 weeks will be very interesting."
         - Against Hartwell: 801(d)(2)(A) — his own statement. Admissible.
         - Against Pacific Growth: 801(d)(2)(E) — co-conspirator. Admissible IF conspiracy proven.

      BOTTOM LINE: Hartwell's own emails are automatically admissible (party admissions).
      Chen's testimony is admissible if she testifies live. The defense has NO viable
      hearsay objection to the core evidence.

  - id: L57
    tier: complex_reasoning
    question: "Assume the settlement fund of $347.5M is invested at 4% annual return during the claims administration period (August 2024 to June 2025 — approximately 10 months). How much interest accrues? The settlement says the fund goes to an escrow. Who gets the interest — the class or the defendants? What does the settlement agreement typically say about this?"
    requires: "settlement_agreement (escrow, fund administration) + calculation"
    answer: |
      INTEREST CALCULATION:
      - Principal: $347,500,000
      - Rate: 4% annual
      - Period: ~10 months (Aug 2024 to June 2025) = 10/12 year
      - Interest: $347,500,000 × 0.04 × (10/12) = $11,583,333

      So approximately $11.6 million in interest accrues.

      WHO GETS THE INTEREST:
      - Under standard class action settlement practice, interest earned on the
        settlement fund BECOMES PART OF the settlement fund
      - The settlement agreement typically states the "Settlement Fund" includes
        "all interest or income earned thereon"
      - This means the $11.6M goes to the CLASS (increases the Net Settlement Fund)

      LEGAL BASIS:
      - The fund is held in a "Qualified Settlement Fund" (QSF) under IRC § 468B
      - A QSF is treated as a separate tax entity
      - Interest is taxable to the fund (not to defendants or plaintiffs until distributed)
      - Tax on the interest (~$2.9M at corporate rate) is paid FROM the fund
      - Net additional to class: ~$8.7M ($11.6M - $2.9M tax)

      IMPACT ON PER-SHARE RECOVERY:
      - Net settlement fund increases from ~$264M to ~$273M
      - Per-share recovery increases from $3.42 to approximately $3.53

  - id: L58
    tier: complex_reasoning
    question: "The merger agreement has a breakup fee of $125M. The MAE threshold is $75M. Meridian's insider trading caused 'artificial inflation' of $17.28/share on ~22.4M shares = ~$387M in total artificial market impact. Could Global Systems have argued that Meridian's fraud constituted a 'Material Adverse Effect' that allowed them to walk away from the merger? Why didn't they?"
    requires: "merger_agreement (MAE definition, breakup fee, carve-outs) + expert_report (inflation) + timeline (merger closed Sept 2021, fraud revealed June 2022)"
    answer: |
      COULD GLOBAL SYSTEMS HAVE INVOKED THE MAE CLAUSE?

      THRESHOLD TEST:
      - MAE threshold: $75M or 15% of net assets (whichever is less)
      - Artificial inflation caused: $387M market impact
      - $387M >> $75M → EXCEEDS the dollar threshold

      BUT THE MAE CARVE-OUTS (from merger agreement Article X, Section 10.1):
      The definition EXCLUDES:
      (i) changes in general economic conditions
      (ii) changes in the industry
      (iii) changes in GAAP
      (iv) natural disasters/war
      (v) pandemics
      (vi) failure to meet projections
      (vii) THE ANNOUNCEMENT OF THIS MERGER ← KEY
      (viii) actions at Parent's request

      ANALYSIS:
      - Insider trading BY A THIRD PARTY (Meridian) is NOT in the carve-out list
      - It's not a "general economic condition" or "industry change"
      - It's arguably a change in the "business" of Apex (reputational harm, regulatory scrutiny)
      - Global Systems MIGHT have had a colorable MAE argument

      WHY THEY DIDN'T INVOKE IT:
      1. TIMING: The merger CLOSED on September 22, 2021. The fraud wasn't revealed until
         January 2022 (SEC investigation) and June 2022 (complaint). By then, the merger
         was already done — MAE can only be invoked BEFORE closing.

      2. THEY DIDN'T KNOW: Global Systems had no reason to know about Meridian's trading
         before the merger closed. The fraud was in APEX's stock, but it didn't affect
         APEX's underlying business (the MAE is about the TARGET's business health).

      3. WRONG DIRECTION: The fraud made Apex's stock go UP (not down). MAE clauses
         protect the acquirer from the target's value DECLINING. Artificial inflation
         actually made the $84/share price look more reasonable, not less.

      CONCLUSION: Global Systems could NOT have used the MAE clause because (a) the fraud
      wasn't discovered until after closing, (b) it didn't affect Apex's underlying business,
      and (c) the fraud caused inflation (not decline) in value.

  - id: L59
    tier: complex_reasoning
    question: "The SEC investigation was opened January 10, 2022 based on a FINRA referral. Chen's cooperation agreement was May 1, 2022. Between January and May, what was likely happening procedurally? Reconstruct the probable investigative steps using the SEC investigation notes, the enforcement manual, and standard SEC practice."
    requires: "sec_investigation_file_notes (timeline) + knowledge of SEC enforcement process + compliance_manual (document retention)"
    answer: |
      PROBABLE INVESTIGATIVE TIMELINE (January - May 2022):

      JANUARY 2022:
      Week 1-2: SEC receives FINRA referral, opens Matter Under Inquiry (MUI)
      Week 3: Staff reviews FINRA surveillance data showing anomalous APEX trading
      Week 4: Formal Order of Investigation (FOI) authorized by Division Director
      - FOI grants subpoena power

      FEBRUARY 2022:
      Week 1: Subpoenas issued to:
        - Meridian Capital (all APEX trading records, communications, compliance files)
        - Goldman Sachs (prime broker records for Meridian accounts)
        - CBOE/options exchanges (option trading records)
        - Phone companies (call records for Hartwell)
      Week 2-4: Begin receiving Blue Sheet data (trade-by-trade records)
      - Staff analysts map the trading pattern
      - Identify temporal correlation: tip date → first trade → announcement

      MARCH 2022:
      - Receive document production from Meridian (2.4 million pages per investigation notes)
      - Key discovery: Hartwell-Chen email chain found
      - Begin witness interviews (non-target employees first)
      - Parallel: coordinate with DOJ/FBI for potential criminal referral

      APRIL 2022:
      - Chen's personal attorney contacts SEC (proffer session)
      - "Queen for a day" proffer: Chen tells her story without it being used against her
      - SEC evaluates cooperation value: VERY HIGH (direct witness to tip + compliance failures)
      - Draft cooperation agreement circulated
      - Begin preparing civil complaint

      MAY 2022:
      - May 1: Cooperation agreement formalized
      - Chen provides sworn declaration
      - SEC finalizes complaint
      - Coordinate with DOJ on timing (SEC files first for asset freeze)
      - Prepare TRO/asset freeze application

      KEY PROCEDURAL STEPS (per SEC Enforcement Manual):
      1. MUI → FOI (formal authorization)
      2. Subpoenas → Blue Sheets → Document production
      3. Witness interviews (ascending order of culpability)
      4. Proffer sessions with potential cooperators
      5. Wells Notice (opportunity to respond before charges) — likely sent April-May 2022
      6. Authorization memo to Commission for filing
      7. Complaint filed + emergency relief (asset freeze)

  - id: L60
    tier: complex_reasoning
    question: "Construct a complete 'but-for' damages analysis: In a world where Meridian never traded (no insider trading occurred), what would have happened to Apex's stock price? Would the merger still have closed? Would investors have been better or worse off? Calculate the counterfactual outcome for a hypothetical investor who bought 10,000 shares on March 5, 2021."
    requires: "expert_report (inflation analysis) + merger_agreement ($84/share, closing) + sec_complaint (price data) + settlement (damages formula)"
    answer: |
      COUNTERFACTUAL ("BUT-FOR") WORLD — NO INSIDER TRADING:

      STOCK PRICE PATH WITHOUT FRAUD:
      - Pre-tip (Feb 22): ~$47.82
      - Without Meridian's buying pressure: stock stays at ~$47-48 until announcement
      - March 15 announcement: stock jumps to merger price area (~$80-84)
      - Merger close (Sept 22): shareholders receive $84.00

      WITH FRAUD (ACTUAL):
      - Pre-tip: $47.82
      - Meridian buying (Feb 28-March 15): stock rises to ~$55-65 BEFORE announcement (due to demand pressure)
      - March 15 announcement: stock jumps to $78.50 (but from higher base)
      - Merger close: $84.00

      HYPOTHETICAL INVESTOR: Buys 10,000 shares on March 5, 2021

      ACTUAL WORLD:
      - Purchase price on March 5: approximately $55.00 (inflated by ~$7-8 from Meridian's buying)
      - Cost: 10,000 × $55 = $550,000
      - Received at merger: 10,000 × $84 = $840,000
      - Actual profit: $290,000

      BUT-FOR WORLD:
      - Purchase price on March 5 (no fraud): approximately $47.82
      - Cost: 10,000 × $47.82 = $478,200
      - Received at merger: 10,000 × $84 = $840,000
      - But-for profit: $361,800

      DAMAGES = But-for profit - Actual profit = $361,800 - $290,000 = $71,800
      OR equivalently: Overpayment = $55.00 - $47.82 = $7.18/share × 10,000 = $71,800

      WOULD THE MERGER STILL HAVE CLOSED?
      - YES — Meridian's trading didn't affect the MERGER ITSELF
      - Global Systems was acquiring APEX for its technology, not its stock price
      - The merger consideration ($84/share) was set by negotiation, not market price
      - Without insider trading, the stock would have jumped MORE on announcement day
        (from $47.82 to $78.50+ instead of from $55+ to $78.50)

      SETTLEMENT RECOVERY:
      - Investor's Recognized Loss: $71,800
      - Pro-rata recovery: $71,800 / $412,000,000 × $264,312,500 = ~$46,000
      - Net position: Kept $290,000 profit from merger + $46,000 settlement = $336,000 total gain
      - vs. But-for: Would have gained $361,800
      - REMAINING UNCOMPENSATED LOSS: $361,800 - $336,000 = $25,800 (~36% unrecovered)
