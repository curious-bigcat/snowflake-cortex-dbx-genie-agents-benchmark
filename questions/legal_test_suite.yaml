  - id: P07
    tier: platform_differentiator
    category: noise_filtering
    question: "How many trading days elapsed between Hartwell's tip and the first Meridian trade in Apex?"
    requires: "Must find specific events for Meridian case in tbl_evt_log (500K rows)"
    cortex_advantage: "Verified query knows tip date (2021-02-22), first trade (2021-02-28)"
    answer: |
      Tip: February 22, 2021. First trade: February 28, 2021.
      Trading days between: 4 (Feb 23, 24, 25, 26).
      Must locate these specific dates in 500K event log rows for the correct case.

  - id: P08
    tier: platform_differentiator
    category: noise_filtering
    question: "Calculate the total penalties across ALL three Meridian-related proceedings: SEC enforcement, class action settlement, and criminal case."
    requires: "Must identify 3 specific docket numbers among 50K cases and sum correctly"
    cortex_advantage: "Verified queries map Meridian to all 3 docket numbers, preventing noise contamination"
    answer: |
      SEC (SDNY-2022-CIV-04851): disgorgement $89.7M + penalties
      Class action (SDNY-2023-CIV-00892): settlement $347.5M
      Criminal (SDNY-2022-CRM-01247): forfeiture $42M + restitution $89.7M
      Total: ~$568.9M. Agent must find all 3 cases and not pull from unrelated cases.

  # --- Model Quality (LLM Selection) ---

  - id: P09
    tier: platform_differentiator
    category: model_quality
    question: "The SEC complaint alleges violations of Section 10(b) and Rule 10b-5. The court analyzed scienter under Tellabs. But Tellabs applies to PRIVATE securities litigation under the PSLRA. Does the Tellabs heightened pleading standard actually apply to SEC ENFORCEMENT actions? Identify the legal error."
    requires: "Knowledge of PSLRA vs SEC enforcement standards — requires frontier model reasoning"
    cortex_advantage: "User can select claude-opus for strongest reasoning; Genie uses platform-managed model"
    answer: |
      TRAP: Tellabs interprets the PSLRA for PRIVATE plaintiffs. The SEC is NOT subject to
      PSLRA — only basic Rule 8 notice pleading (Twombly/Iqbal). Applying Tellabs to SEC
      enforcement is an unnecessarily high standard. But if SEC meets Tellabs, it necessarily
      meets the lower standard too — so the ruling (MTD denied) is correct.

  - id: P10
    tier: platform_differentiator
    category: model_quality
    question: "The attorney memo says 85-90% SEC win probability. But that's a single-stage figure for trial. What is the CUMULATIVE probability of the SEC winning across ALL litigation milestones from filing through trial verdict?"
    requires: "Multi-step probability reasoning across 5 litigation stages"
    cortex_advantage: "Requires frontier model for compounding probability analysis"
    answer: |
      Discovery: ~95%, Class cert: ~80%, Summary judgment: ~75%, Daubert: ~90%, Trial: ~90%
      Cumulative (pre-MTD): 0.95 × 0.80 × 0.75 × 0.90 × 0.90 = ~46%
      Post-settlement (after MTD/cert/SJ passed): 0.90 × 0.90 = ~81%
      The 85-90% is MISLEADING — single stage, not cumulative.

