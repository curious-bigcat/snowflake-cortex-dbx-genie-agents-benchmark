         - Of which ARTIFICIAL INFLATION (fraud): $17.28/share

      2. Total damages calculation:
         - Damaged shares: 22.4 million
         - Inflation per share: $17.28 (peak) / $18.39 (volume-weighted average)
         - Total: 22.4M × $18.39 = ~$412M

      3. Settlement math:
         - Gross settlement: $347.5M
         - Attorney fees (22.5%): -$78.2M
         - Admin costs: ~-$5M
         - Net to class: ~$264.3M

