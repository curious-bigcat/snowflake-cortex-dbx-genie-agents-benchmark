  - id: P11
    tier: platform_differentiator
    category: hybrid_filtered
    question: "According to Section 5.2 of the compliance manual, what is the penalty for failing to check the restricted list? How many trades in our database were executed without this check for the Meridian case?"
    requires: "compliance_manual (Section 5.2) + tbl_evt_log filtered to Meridian docket"
    cortex_advantage: "Cortex Search filters document_category='compliance_manual' then SQL on tbl_evt_log"
    answer: |
      Compliance Manual §5.2: Failure is a "material compliance violation subject to immediate
      escalation under Section 14.7." All 47 Meridian trades had no restricted list check.

  - id: P12
    tier: platform_differentiator
    category: hybrid_filtered
    question: "The expert report estimates $17.28 per-share inflation. The settlement agreement defines 'Recognized Loss' for distribution. Are these the same number? Explain the difference using both documents."
    requires: "expert_report (inflation methodology) + settlement_agreement (allocation formula)"
    cortex_advantage: "Cortex Search can filter by document_category to retrieve exactly the right two documents"
    answer: |
      NOT the same. $17.28 is PEAK inflation on announcement day (March 15).
      "Recognized Loss" uses volume-weighted methodology varying by purchase date and holding period.
      Per-share recovery ($3.42) is much lower: net fund / total recognized losses across all claimants.
