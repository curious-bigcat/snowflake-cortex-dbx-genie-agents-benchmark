    question: "The expert report estimates $17.28 per-share artificial inflation, but the settlement pays only $3.42 per damaged share. Meanwhile, the merger price was $84.00 and pre-tip price was $47.82. Reconcile ALL these numbers: Why is the per-share recovery so much lower than the per-share inflation? Account for the mathematical relationship between all figures."
