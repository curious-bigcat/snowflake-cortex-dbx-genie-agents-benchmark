  - id: L53
    tier: complex_reasoning
    question: "If you were representing a class member who purchased 50,000 shares of APEX at $65.00 on March 10, 2021 and held through the merger (received $84.00/share), did they actually LOSE money? Can they still recover under the settlement? Explain the paradox."
    requires: "settlement_agreement (allocation formula, class period) + expert_report (inflation $17.28) + merger_agreement ($84/share)"
    answer: |
      THE PARADOX:

      ACTUAL P&L:
      - Bought: 50,000 shares × $65.00 = $3,250,000
      - Received at merger close: 50,000 × $84.00 = $4,200,000
      - ACTUAL PROFIT: $950,000 (29.2% gain)

      SO DID THEY LOSE MONEY? NO — they profited.

      CAN THEY STILL RECOVER? YES — here's why:

      THE LEGAL THEORY OF DAMAGES:
      - At $65.00, the stock was ARTIFICIALLY INFLATED by approximately $17.28/share
      - Without the fraud, the stock would have been trading at ~$65.00 - $17.28 = ~$47.72
      - The investor OVERPAID by $17.28/share due to the artificial inflation
      - Their "Recognized Loss" = (Purchase Price - True Value) × Shares
      - Recognized Loss = ($65.00 - $47.72) × 50,000 = $864,000

      THE PARADOX RESOLVED:
      - The investor MADE money overall (because the merger delivered $84/share)
      - But they OVERPAID for their shares due to fraud-induced inflation
      - Without the fraud, they could have bought at ~$47.72 and STILL received $84
      - Their ADDITIONAL profit (without fraud): ($84 - $47.72) × 50,000 = $1,814,000
      - Instead they got: ($84 - $65) × 50,000 = $950,000
      - LOSS DUE TO FRAUD: $1,814,000 - $950,000 = $864,000

      Under the settlement allocation formula:
      - Their Recognized Loss: $864,000
      - Pro-rata share: $864,000 / Total Recognized Losses × Net Settlement Fund
      - Estimated recovery: ~$3.42 × 50,000 = $171,000

