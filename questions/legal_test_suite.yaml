  - id: L51
    tier: complex_reasoning
    question: "The SEC complaint states trading period was 'February 28, 2021 through May 30, 2022.' The settlement class period is 'March 1, 2021 through June 14, 2022.' These are DIFFERENT. Why do they differ by specific days, and what legal significance does each boundary date have?"
    requires: "sec_complaint (trading period) + settlement_agreement (class period) + court_opinion (filing date June 15)"
    answer: |
      THE FOUR BOUNDARY DATES AND THEIR SIGNIFICANCE:

      1. FEBRUARY 28, 2021 (SEC trading period START):
         - First actual trade by Meridian
         - This is when the DEFENDANTS began violating the law
         - The SEC cares about when the FRAUD started

      2. MARCH 1, 2021 (Class period START):
         - First day INVESTORS could have been harmed
         - Why one day later? Feb 28 was a Sunday in 2021 — wait, actually Feb 28, 2021 was a Sunday
         - Actually: Feb 28 WAS a Sunday, so March 1 was the first TRADING DAY
         - The class period starts when class members could have PURCHASED at inflated prices
         - Meridian may have placed orders on Feb 28 (Sunday) for execution Monday March 1

      3. MAY 30, 2022 (SEC trading period END):
         - Last date of any scheme-related activity by defendants
         - May include cover-up activities, obstruction, or delayed profit-taking

      4. JUNE 14, 2022 (Class period END):
         - Day BEFORE the SEC filed its complaint (June 15, 2022)
         - The complaint filing IS the corrective disclosure
         - After June 15, investors had the TRUE information and couldn't be defrauded
         - Class period ends the day the artificial inflation is removed from the stock price

      LEGAL SIGNIFICANCE:
      - SEC period = scope of DEFENDANT'S misconduct (for penalties/disgorgement)
      - Class period = scope of INVESTOR'S damages (for settlement allocation)
      - The SEC period is BROADER because it includes pre-market activity and post-revelation cover-up
      - The class period is defined by when investors could be INJURED (buying at inflated prices)

