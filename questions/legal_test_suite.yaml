  # --- Coded Column Decoding (Semantic Model) ---

  - id: P01
    tier: platform_differentiator
    category: coded_columns
    question: "How many plaintiffs filed motions to dismiss across all securities fraud cases in 2022?"
    requires: "pty_role_cd = 'PLF' + evt_typ_cd = 'MTD' + case_typ_cd = 'SEC' + date filtering"
    cortex_advantage: "Semantic model decodes PLF=Plaintiff, MTD=Motion to Dismiss, SEC=Securities Fraud"
    answer: |
      Requires joining tbl_pty_info (pty_role_cd='PLF') → tbl_case_pty_atty → tbl_evt_log (evt_typ_cd='MTD')
      → tbl_case_mstr (case_typ_cd='SEC', filing year 2022).
      Without semantic model, agent must guess what PLF, MTD, SEC mean from raw column names.

  - id: P02
    tier: platform_differentiator
    category: coded_columns
    question: "List all cases where the defendant was granted summary judgment but the ruling was later reversed on appeal."
    requires: "pty_role_cd = 'DEF' + ruling_outcome_cd = 'GRT' + evt_typ_cd = 'SJ' + appeal_outcome_cd = 'REV'"
    cortex_advantage: "Four coded column mappings defined in semantic model (DEF, GRT, SJ, REV)"
    answer: |
      Join tbl_ruling (ruling_outcome_cd='GRT', ruling_type involving SJ) → tbl_appeal (appeal_outcome_cd='REV')
      on the same docket_no. Requires decoding 4 separate coded columns correctly.

  - id: P03
    tier: platform_differentiator
    category: coded_columns
    question: "What percentage of SEC enforcement actions result in settlements versus going to trial?"
    requires: "case_typ_cd = 'SEC' + stl_terms_cd values + evt_typ_cd for trial events"
    cortex_advantage: "Semantic model defines SEC=enforcement, maps settlement vs trial event codes"
    answer: |
      Count cases in tbl_case_mstr where case_typ_cd='SEC', then check tbl_settlement
      (has settlement record) vs tbl_evt_log (has trial/verdict event). Calculate percentage.

  # --- Complex Join Paths (Semantic Model Relationships) ---

  - id: P04
    tier: platform_differentiator
    category: join_paths
    question: "For each attorney who represented both plaintiffs and defendants in different cases, show their total case count and how many they won on each side."
    requires: "tbl_atty_reg → tbl_case_pty_atty → tbl_pty_info (self-join on attorney across roles) + tbl_ruling for outcomes"
    cortex_advantage: "Semantic model defines join paths between all 4 tables and role code meanings"
    answer: |
      Self-join tbl_case_pty_atty on atty_id where the same attorney appears with pty_role_cd='PLF'
      in some cases and pty_role_cd='DEF' in others. Then join to tbl_ruling for win/loss.
      Requires understanding the bridge table pattern + code decoding.

  - id: P05
    tier: platform_differentiator
    category: join_paths
    question: "Which judges have the highest rate of denying motions to dismiss in insider trading cases? What is the average time from case filing to MTD ruling for each?"
    requires: "tbl_ruling (judge, MTD denial) → tbl_case_mstr (case type) → tbl_evt_log (timeline)"
    cortex_advantage: "Three-table join with date arithmetic, relationships pre-defined in semantic model"
    answer: |
      Join tbl_ruling (ruling on MTD, denied) → tbl_case_mstr (case_typ_cd for insider trading)
      → tbl_evt_log (filing date vs MTD ruling date). Group by judge, calculate denial rate and avg days.

  # --- Noise Filtering (Verified Queries) ---

