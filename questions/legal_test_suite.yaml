         Chen's failure to report and her active approval of trades could constitute aiding and abetting
         the primary 10b-5 violation. She had actual knowledge of the fraud.

      2. "JUST FOLLOWING ORDERS" IS NOT A DEFENSE:
         In securities law, employees cannot avoid liability by claiming they followed a superior's
         instructions. See SEC v. Savoy Industries (employees liable for executing trades they knew
         were manipulative).

      3. BUT — CHEN HAS A COOPERATION AGREEMENT:
         Chen entered a cooperation agreement on May 1, 2022. This likely provides:
         - Immunity from personal enforcement action
