  - id: L42
    tier: complex_reasoning
    question: "The SEC complaint alleges violations of Section 10(b) and Rule 10b-5. The court opinion analyzes scienter under Tellabs. But Tellabs applies to PRIVATE securities litigation (PSLRA). Does the Tellabs heightened pleading standard actually apply to SEC ENFORCEMENT actions? Identify the legal error in the court's opinion."
    requires: "court_opinion (Tellabs analysis) + knowledge of PSLRA vs. SEC enforcement standards"
    answer: |
      THIS IS A TRAP QUESTION. There IS a legal nuance here:
      - Tellabs v. Makor Issues (2007) interprets the PSLRA's heightened pleading standard for PRIVATE plaintiffs
      - The SEC, as a government enforcement agency, is NOT subject to the PSLRA's heightened pleading standards
      - The SEC only needs to plead scienter under basic Rule 8 notice pleading (Twombly/Iqbal)
      - The court opinion applying Tellabs to an SEC enforcement action is arguably applying an UNNECESSARILY HIGH standard
      - However, if the SEC meets the Tellabs standard, it necessarily meets the lower standard too
      - So the ruling (DENIED motion to dismiss) is correct even if the analytical framework is overly demanding

      A sophisticated agent should note this distinction. An average agent will simply accept the court's framework.

  - id: L43
    tier: complex_reasoning
    question: "Assume Pacific Growth Partners argues it had no duty to inquire about the source of Hartwell's tip because Hartwell said it was from 'quantitative screens.' Under Dirks v. SEC (1983), what must the SEC prove about a tippee's liability? Does the evidence in our documents meet that standard?"
    requires: "knowledge of Dirks v. SEC tippee liability + sec_complaint (Pacific Growth's trading) + email_chain_02 (Hartwell's tip to Pacific Growth)"
    answer: |
      Under Dirks v. SEC, 463 U.S. 646 (1983), tippee liability requires:
      1. The tipper (Hartwell) breached a fiduciary duty by disclosing MNPI
      2. The tipper received a personal benefit from the tip
      3. The tippee (Pacific Growth) KNEW OR SHOULD HAVE KNOWN the information was MNPI

      Evidence from our documents:
      - Hartwell's email to Pacific Growth: "don't wait on APEX. Next 2 weeks will be very interesting. Trust me on this one." — This is circumstantial evidence of a tip.
      - Pacific Growth's trading began ONE DAY after the email (March 1, 2021)
      - They accumulated 1,200,000 shares generating $34.2M in profits
      - Hartwell's "trust me" language suggests a close relationship implying access to inside information

      The "quantitative screens" defense is weak because:
      - No documentation of any quantitative model output recommending APEX
      - Timing (day after Hartwell's email) undermines independent analysis claim
      - "Trust me on this one" is not how quantitative recommendations are communicated

      The SEC likely meets the Dirks standard — Pacific Growth "should have known."

