name: legal_case_management
description: >
  Legal case management database with 12 tables covering cases, parties, attorneys,
  events, documents, rulings, claims, damages, appeals, and settlements.
  NOTE: Column names use abbreviated codes. This semantic model provides the
  full business meaning of each code.

tables:
  - name: tbl_case_mstr
    description: Master table of all court cases. Each row is one case identified by docket number.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_CASE_MSTR
    columns:
      - name: docket_no
        description: Unique case identifier. Format is JURISDICTION-YEAR-TYPE-SEQUENCE (e.g., SDNY-2023-CIV-00001).
        data_type: VARCHAR
        is_primary_key: true
      - name: filing_dt
        description: Date the case was originally filed with the court.
        data_type: DATE
      - name: case_typ_cd
        description: "Case type code. Values: CIV=Civil, CRM=Criminal, BKR=Bankruptcy, ADM=Administrative, APP=Appeal"
        data_type: VARCHAR
      - name: jrsd_cd
        description: "Jurisdiction code. Values: SDNY=S.D. New York, CDCA=C.D. California, NDIL=N.D. Illinois, EDPA=E.D. Pennsylvania, SDTX=S.D. Texas, DDC=D. of Columbia, NDGA=N.D. Georgia, DMA=D. Massachusetts, EDVA=E.D. Virginia, SDFL=S.D. Florida"
        data_type: VARCHAR
      - name: judge_id
        description: ID of the assigned judge (format JDG-NNNN)
        data_type: VARCHAR
      - name: case_sts_cd
        description: "Case status code. Values: OPN=Open/Active, CLS=Closed, STL=Settled, DSM=Dismissed, APL=On Appeal"
        data_type: VARCHAR
      - name: cls_dt
        description: Date the case was closed (NULL if still open)
        data_type: DATE
      - name: nat_suit_cd
        description: Nature of suit code (federal statistical code)
        data_type: VARCHAR
      - name: jury_dmnd_flg
        description: "Whether a jury trial was demanded. Y=Yes, N=No"
        data_type: VARCHAR
      - name: class_actn_flg
        description: "Whether this is a class action case. Y=Yes, N=No"
        data_type: VARCHAR
      - name: consol_flg
        description: "Whether this case is consolidated with other cases. Y=Yes, N=No"
        data_type: VARCHAR
      - name: related_case_no
        description: Docket number of a related case (NULL if none)
        data_type: VARCHAR
      - name: amt_in_controversy
        description: Dollar amount in controversy (for diversity jurisdiction). NULL for non-civil cases.
        data_type: NUMBER

  - name: tbl_pty_info
    description: Parties involved in litigation (individuals, organizations, government entities).
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_PTY_INFO
    columns:
      - name: pty_id
        description: Unique party identifier (format PTY-NNNNNNN)
        data_type: VARCHAR
        is_primary_key: true
      - name: pty_nm
        description: Full legal name of the party
        data_type: VARCHAR
      - name: pty_typ_cd
        description: "Party type code. Values: IND=Individual, ORG=Organization/Corporation, GOV=Government entity, TRT=Trust or Estate"
        data_type: VARCHAR
      - name: pty_addr_st
        description: State abbreviation of party's address
        data_type: VARCHAR
      - name: pty_addr_ctry
        description: Country code of party's address
        data_type: VARCHAR
      - name: ein_ssn_msk
        description: Masked EIN or SSN (partially redacted)
        data_type: VARCHAR
      - name: sic_cd
        description: Standard Industrial Classification code (for organizations only)
        data_type: VARCHAR
      - name: pub_co_flg
        description: "Whether the party is a publicly traded company. Y=Yes, N=No"
        data_type: VARCHAR

  - name: tbl_atty_reg
    description: Registry of attorneys admitted to practice in the court system.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_ATTY_REG
    columns:
      - name: atty_id
        description: Unique attorney identifier (format ATY-NNNNN)
        data_type: VARCHAR
        is_primary_key: true
      - name: atty_nm
        description: Full name of the attorney
        data_type: VARCHAR
      - name: bar_no
        description: State bar registration number
        data_type: VARCHAR
      - name: bar_st_cd
        description: State where attorney is admitted to the bar
        data_type: VARCHAR
      - name: firm_nm
        description: Law firm name
        data_type: VARCHAR
      - name: jrsd_cd
        description: Primary jurisdiction where attorney practices
        data_type: VARCHAR
      - name: spec_cd
        description: "Specialty code. Values: SEC=Securities, IP=Intellectual Property, ANT=Antitrust, EMP=Employment, ENV=Environmental, TAX=Tax, BKR=Bankruptcy, CRM=Criminal, CRA=Class Action, MNA=M&A"
        data_type: VARCHAR
      - name: adm_dt
        description: Date of admission to the bar
        data_type: DATE
      - name: sts_cd
        description: "Attorney status. Values: ACT=Active, SUS=Suspended, RET=Retired, DIS=Disbarred"
        data_type: VARCHAR
      - name: pro_hac_flg
        description: "Whether admitted pro hac vice (temporary admission). Y=Yes, N=No"
        data_type: VARCHAR

  - name: tbl_case_pty_atty
    description: >
      Bridge table linking cases, parties, and attorneys. Triple many-to-many relationship.
      One case has multiple parties, each party can have multiple attorneys, and attorneys can appear in multiple cases.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_CASE_PTY_ATTY
    columns:
      - name: cpa_id
        description: Surrogate key
        data_type: NUMBER
        is_primary_key: true
      - name: docket_no
        description: FK to tbl_case_mstr.docket_no
        data_type: VARCHAR
      - name: pty_id
        description: FK to tbl_pty_info.pty_id
        data_type: VARCHAR
      - name: atty_id
        description: FK to tbl_atty_reg.atty_id
        data_type: VARCHAR
      - name: pty_role_cd
        description: "Role of the party in this case. Values: PLF=Plaintiff, DEF=Defendant, WIT=Witness, INT=Intervenor, AMC=Amicus Curiae, TPD=Third-Party Defendant"
        data_type: VARCHAR
      - name: lead_counsel_flg
        description: "Whether this attorney is lead counsel for the party. Y=Yes, N=No"
        data_type: VARCHAR
      - name: pro_se_flg
        description: "Whether the party is self-represented (no attorney). Y=Yes, N=No"
        data_type: VARCHAR
      - name: dt_entered
        description: Date the attorney entered an appearance in this case
        data_type: DATE
      - name: dt_withdrawn
        description: Date the attorney withdrew from the case (NULL if still active)
        data_type: DATE

  - name: tbl_evt_log
    description: Log of all case events (motions, hearings, orders, filings, etc.)
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_EVT_LOG
    columns:
      - name: evt_id
        description: Unique event identifier
        data_type: VARCHAR
        is_primary_key: true
      - name: docket_no
        description: FK to tbl_case_mstr.docket_no
        data_type: VARCHAR
      - name: evt_dt
        description: Date the event occurred
        data_type: DATE
      - name: evt_typ_cd
        description: "Event type code. Values: MTN=Motion filed, HRG=Hearing, ORD=Court Order, BRF=Brief filed, JDG=Judgment entered, DSC=Discovery event, STL=Settlement Conference, TRL=Trial, APL=Appeal Filed"
        data_type: VARCHAR
      - name: evt_desc_txt
        description: Free-text description of the event
        data_type: VARCHAR
      - name: filed_by_cd
        description: "Who filed/initiated the event. Values: PLF=Plaintiff, DEF=Defendant, CRT=Court, TPD=Third-Party Defendant, INT=Intervenor"
        data_type: VARCHAR
      - name: rsp_due_dt
        description: Response due date (deadline for opposing party to respond)
        data_type: DATE
      - name: sealed_flg
        description: "Whether this event/filing is sealed. Y=Yes (not publicly accessible), N=No"
        data_type: VARCHAR
      - name: elec_filing_flg
        description: "Whether filed electronically. Y=Yes, N=No (paper filing)"
        data_type: VARCHAR
      - name: pg_cnt
        description: Page count of the filed document (NULL if no document)
        data_type: NUMBER

  - name: tbl_doc_ref
    description: References to documents filed in cases.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_DOC_REF
    columns:
      - name: doc_id
        description: Unique document identifier
        data_type: VARCHAR
        is_primary_key: true
      - name: docket_no
        description: FK to tbl_case_mstr.docket_no
        data_type: VARCHAR
      - name: doc_typ_cd
        description: "Document type. Values: CMP=Complaint, ANS=Answer, MTD=Motion to Dismiss, MSJ=Motion for Summary Judgment, BRF=Brief, EXH=Exhibit, DEC=Declaration, ORD=Order, JDG=Judgment, STL=Settlement Agreement"
        data_type: VARCHAR
      - name: doc_title_txt
        description: Title/description of the document
        data_type: VARCHAR
      - name: filed_dt
        description: Date the document was filed
        data_type: DATE
      - name: pg_cnt
        description: Number of pages in the document
        data_type: NUMBER
      - name: seal_flg
        description: "Whether document is sealed. Y=Yes, N=No"
        data_type: VARCHAR
      - name: doc_seq_no
        description: Sequence number on the docket
        data_type: NUMBER
      - name: att_cnt
        description: Number of attachments/exhibits
        data_type: NUMBER
      - name: file_sz_kb
        description: File size in kilobytes
        data_type: NUMBER
      - name: ocr_flg
        description: "Whether document required OCR processing. Y=Yes, N=No"
        data_type: VARCHAR

  - name: tbl_ruling
    description: Judicial rulings and orders on motions.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_RULING
    columns:
      - name: ruling_id
        description: Unique ruling identifier
        data_type: VARCHAR
        is_primary_key: true
      - name: docket_no
        description: FK to tbl_case_mstr.docket_no
        data_type: VARCHAR
      - name: ruling_dt
        description: Date the ruling was issued
        data_type: DATE
      - name: ruling_cd
        description: "Ruling outcome code. Values: GRT=Granted, DNY=Denied, PART=Granted in Part, MOT=Moot, DFRD=Deferred, WDRN=Withdrawn"
        data_type: VARCHAR
      - name: mtn_typ_cd
        description: "Type of motion ruled upon. Values: MTD=Motion to Dismiss, MSJ=Motion for Summary Judgment, MTC=Motion to Compel, MIL=Motion in Limine, MPC=Motion for Protective Order, MSL=Motion to Seal, MCV=Motion for Class Certification"
        data_type: VARCHAR
      - name: judge_id
        description: Judge who issued the ruling
        data_type: VARCHAR
      - name: reasoning_txt
        description: Brief text of the court's reasoning
        data_type: VARCHAR
      - name: precedent_cited
        description: Key precedent case cited in the ruling (NULL if none specified)
        data_type: VARCHAR
      - name: pub_flg
        description: "Whether ruling is published/reported. Y=Yes, N=No (unpublished)"
        data_type: VARCHAR

  - name: tbl_statute_cite
    description: Statute citations referenced in rulings.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_STATUTE_CITE
    columns:
      - name: cite_id
        description: Surrogate key
        data_type: NUMBER
        is_primary_key: true
      - name: ruling_id
        description: FK to tbl_ruling.ruling_id
        data_type: VARCHAR
      - name: statute_ref
        description: Full statute citation (e.g., '15 USC 78j(b)', 'Fed.R.Civ.P. 12(b)(6)')
        data_type: VARCHAR
      - name: cite_typ_cd
        description: "How the statute was cited. Values: PRI=Primary authority (relied upon), SEC=Secondary (discussed), DIS=Distinguished, OVR=Overruled"
        data_type: VARCHAR
      - name: pin_cite_txt
        description: Pin cite to specific page/section within the statute
        data_type: VARCHAR

  - name: tbl_claim
    description: Individual claims/causes of action within a case. One case can have multiple claims.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_CLAIM
    columns:
      - name: claim_id
        description: Unique claim identifier
        data_type: VARCHAR
        is_primary_key: true
      - name: docket_no
        description: FK to tbl_case_mstr.docket_no
        data_type: VARCHAR
      - name: claim_typ_cd
        description: "Claim type code. Values: NEG=Negligence, BRC=Breach of Contract, FRD=Fraud, SEC10B=Securities Fraud 10b-5, ANT=Antitrust Violation, INF=Patent Infringement, EMP=Employment Discrimination, ENV=Environmental Violation, RICO=RICO, DFM=Defamation"
        data_type: VARCHAR
      - name: claim_no
        description: Claim number within the case (1st claim, 2nd claim, etc.)
        data_type: NUMBER
      - name: sts_cd
        description: "Claim status. Values: ACT=Active, DSM=Dismissed, STL=Settled, JDG=Judgment entered, WDRN=Withdrawn"
        data_type: VARCHAR
      - name: filed_dt
        description: Date the claim was filed
        data_type: DATE
      - name: dsm_dt
        description: Date the claim was dismissed (NULL if not dismissed)
        data_type: DATE
      - name: statute_basis
        description: Statutory basis for the claim (e.g., '15 USC 78j(b)')
        data_type: VARCHAR
      - name: class_cert_flg
        description: "Whether class certification was granted for this claim. Y=Yes, N=No"
        data_type: VARCHAR

  - name: tbl_damages
    description: Damages sought and/or awarded for each claim.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_DAMAGES
    columns:
      - name: dmg_id
        description: Surrogate key
        data_type: NUMBER
        is_primary_key: true
      - name: claim_id
        description: FK to tbl_claim.claim_id
        data_type: VARCHAR
      - name: dmg_typ_cd
        description: "Damage type. Values: CMP=Compensatory, PNT=Punitive, STT=Statutory, NOM=Nominal, LQD=Liquidated, TRB=Treble (tripled), ATF=Attorney Fees, INJ=Injunctive Relief (no dollar amount)"
        data_type: VARCHAR
      - name: amt_sought
        description: Dollar amount sought by plaintiff (NULL for injunctive relief)
        data_type: NUMBER
      - name: amt_awarded
        description: Dollar amount actually awarded by court (NULL if not yet adjudicated)
        data_type: NUMBER
      - name: curr_cd
        description: Currency code (USD, EUR, GBP)
        data_type: VARCHAR
      - name: pre_jdg_int_flg
        description: "Whether pre-judgment interest was requested. Y=Yes, N=No"
        data_type: VARCHAR
      - name: mult_cd
        description: "Damages multiplier. Values: NULL=no multiplier, 2X=double damages, 3X=treble damages"
        data_type: VARCHAR

  - name: tbl_appeal
    description: Appeals from district court decisions to circuit courts.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_APPEAL
    columns:
      - name: appeal_id
        description: Unique appeal identifier
        data_type: VARCHAR
        is_primary_key: true
      - name: orig_docket_no
        description: FK to tbl_case_mstr.docket_no (the original case being appealed)
        data_type: VARCHAR
      - name: appeal_docket_no
        description: New docket number assigned by appellate court
        data_type: VARCHAR
      - name: circuit_cd
        description: "Circuit court hearing the appeal (e.g., '2d Cir.', '9th Cir.', 'Fed. Cir.')"
        data_type: VARCHAR
      - name: panel_judges
        description: Comma-separated list of panel judge IDs
        data_type: VARCHAR
      - name: filed_dt
        description: Date the appeal was filed
        data_type: DATE
      - name: oral_arg_dt
        description: Date of oral argument (NULL if not yet scheduled or decided on briefs)
        data_type: DATE
      - name: decision_dt
        description: Date the appellate decision was issued
        data_type: DATE
      - name: disposition_cd
        description: "Appellate disposition. Values: AFM=Affirmed, REV=Reversed, RMD=Remanded, DISM=Dismissed, VACATE=Vacated"
        data_type: VARCHAR
      - name: en_banc_flg
        description: "Whether heard en banc (full court). Y=Yes, N=No (three-judge panel)"
        data_type: VARCHAR
      - name: cert_petition_flg
        description: "Whether certiorari was petitioned to Supreme Court. Y=Yes, N=No"
        data_type: VARCHAR

  - name: tbl_settlement
    description: Settlement agreements and details.
    base_table:
      database: LEGAL_BENCHMARK_DB
      schema: LEGAL
      table: TBL_SETTLEMENT
    columns:
      - name: stl_id
        description: Unique settlement identifier
        data_type: VARCHAR
        is_primary_key: true
      - name: docket_no
        description: FK to tbl_case_mstr.docket_no
        data_type: VARCHAR
      - name: stl_dt
        description: Date settlement was reached
        data_type: DATE
      - name: stl_amt
        description: Total settlement amount in dollars
        data_type: NUMBER
      - name: stl_terms_cd
        description: "Settlement terms code. Values: CSH=Cash Payment, STK=Stock/Equity, INJ=Injunctive Terms, MON=Monitoring, ADM=Admission of Liability, NDL=No Admission of Liability, CPN=Coupon Settlement"
        data_type: VARCHAR
      - name: conf_flg
        description: "Whether settlement terms are confidential. Y=Yes (terms sealed), N=No (public)"
        data_type: VARCHAR
      - name: ct_approval_flg
        description: "Whether court approval was required and obtained. Y=Yes, N=No"
        data_type: VARCHAR
      - name: opt_out_cnt
        description: Number of class members who opted out (class actions only)
        data_type: NUMBER
      - name: class_sz
        description: Total class size (number of class members)
        data_type: NUMBER
      - name: atty_fee_pct
        description: Attorney fee percentage of settlement
        data_type: NUMBER
      - name: fund_admin
        description: Name of the settlement fund administrator
        data_type: VARCHAR

relationships:
  - name: case_to_events
    left_table: tbl_evt_log
    right_table: tbl_case_mstr
    relationship_type: many_to_one
    join_columns:
      - left_column: docket_no
        right_column: docket_no
  - name: case_to_documents
    left_table: tbl_doc_ref
    right_table: tbl_case_mstr
    relationship_type: many_to_one
    join_columns:
      - left_column: docket_no
        right_column: docket_no
  - name: case_to_rulings
    left_table: tbl_ruling
    right_table: tbl_case_mstr
    relationship_type: many_to_one
    join_columns:
      - left_column: docket_no
        right_column: docket_no
  - name: case_to_claims
    left_table: tbl_claim
    right_table: tbl_case_mstr
    relationship_type: many_to_one
    join_columns:
      - left_column: docket_no
        right_column: docket_no
  - name: claim_to_damages
    left_table: tbl_damages
    right_table: tbl_claim
    relationship_type: many_to_one
    join_columns:
      - left_column: claim_id
        right_column: claim_id
  - name: case_to_appeals
    left_table: tbl_appeal
    right_table: tbl_case_mstr
    relationship_type: many_to_one
    join_columns:
      - left_column: orig_docket_no
        right_column: docket_no
  - name: case_to_settlements
    left_table: tbl_settlement
    right_table: tbl_case_mstr
    relationship_type: many_to_one
    join_columns:
      - left_column: docket_no
        right_column: docket_no
  - name: ruling_to_citations
    left_table: tbl_statute_cite
    right_table: tbl_ruling
    relationship_type: many_to_one
    join_columns:
      - left_column: ruling_id
        right_column: ruling_id
  - name: case_party_attorney_bridge
    left_table: tbl_case_pty_atty
    right_table: tbl_case_mstr
    relationship_type: many_to_one
    join_columns:
      - left_column: docket_no
        right_column: docket_no
    description: >
      Triple bridge table. Join to tbl_pty_info via pty_id and to tbl_atty_reg via atty_id.
      Use dt_withdrawn IS NULL for currently active attorney representations.
      pty_role_cd indicates the party's role: PLF=Plaintiff, DEF=Defendant, etc.

verified_queries:
  - name: plaintiff_motions
    question: "How many motions were filed by plaintiffs?"
    sql: |
      SELECT COUNT(*) as plaintiff_motion_count
      FROM LEGAL_BENCHMARK_DB.LEGAL.TBL_EVT_LOG
      WHERE evt_typ_cd = 'MTN' AND filed_by_cd = 'PLF'

  - name: motion_to_dismiss_outcomes
    question: "What are the outcomes of motions to dismiss?"
    sql: |
      SELECT ruling_cd, COUNT(*) as count
      FROM LEGAL_BENCHMARK_DB.LEGAL.TBL_RULING
      WHERE mtn_typ_cd = 'MTD'
      GROUP BY ruling_cd
      ORDER BY count DESC

  - name: top_cited_statutes
    question: "Which statutes are cited most frequently?"
    sql: |
      SELECT statute_ref, COUNT(*) as citation_count
      FROM LEGAL_BENCHMARK_DB.LEGAL.TBL_STATUTE_CITE
      GROUP BY statute_ref
      ORDER BY citation_count DESC
      LIMIT 10
